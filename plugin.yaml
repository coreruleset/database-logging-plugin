# OWASP CRS Plugin Descriptor
# See plugin-schema.json in coreruleset/plugin-registry for the full JSON Schema definition.
# Docs: https://github.com/coreruleset/plugin-registry

schema_version: 1

plugin:
  name: "database-logging-plugin"
  description: "Logs triggered CRS rules into a SQL database (MySQL/MariaDB or SQLite)."
  long_description: |
    Runs in phase 5, so it does not slow down request processing, and writes
    every message generated by triggered CRS rules into a SQL database. Log
    lines are read from memory via the WEBSERVER_ERROR_LOG variable, so the
    plugin needs no filesystem access to log files.

    Requires ModSecurity compiled with Lua support and the LuaDBI library,
    since the plugin parses and stores log data using a Lua rule script
    (SecRuleScript). Only messages returned by rules with the `log` action
    are captured.

    Supported database backends: MySQL, MariaDB, and SQLite. Support for
    PostgreSQL is planned.
  type: "official"
  category: "logging"
  status: "untested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
  repository: "https://github.com/coreruleset/database-logging-plugin"
  keywords:
    - "logging"
    - "database"
    - "mysql"
    - "mariadb"
    - "sqlite"
    - "audit"

rule_id_range:
  start: 9523000
  end: 9523999

# Requires the WEBSERVER_ERROR_LOG variable, which libModSecurity (v3)
# explicitly does not support (confirmed via ModSecurity's own regression
# test suite: test/test-cases/regression/variable-WEBSERVER_ERROR_LOG.json
# asserts a parser error for it from v3.0.0 on), and Lua rule scripting
# (SecRuleScript), which Coraza does not implement. Only ModSecurity 2.x
# (the Apache module) supports both.
compatibility:
  engines:
    - "modsecurity2"

configuration:
  file: "plugins/database-logging-config.conf"
  variables:
    - name: "tx.database-logging-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enable or disable the plugin (0 to disable)"
      required: false

    - name: "tx.database-logging-plugin_db_type"
      type: "enum"
      default: "MySQL"
      description: "SQL database type to log into"
      allowed_values: ["MySQL", "SQLite3"]

    - name: "tx.database-logging-plugin_db_name"
      type: "string"
      default: ""
      description: "Database name (MySQL/MariaDB) or full path and filename (SQLite)"
      required: true

    - name: "tx.database-logging-plugin_db_login"
      type: "string"
      default: ""
      description: "Database login name. Ignored for SQLite."

    - name: "tx.database-logging-plugin_db_password"
      type: "string"
      default: ""
      description: "Database password. Ignored for SQLite."

    - name: "tx.database-logging-plugin_db_host"
      type: "string"
      default: "localhost"
      description: "Database hostname or IP address. Ignored for SQLite."

    - name: "tx.database-logging-plugin_db_port"
      type: "integer"
      default: 3306
      description: "Database port. Ignored for SQLite."
